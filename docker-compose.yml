services:

  neo4j:
    image: neo4j:5
    container_name: supplier-risk-neo4j

    environment:
      NEO4J_AUTH: neo4j/supplier-risk-local

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data


  api:
    build: .

    container_name: supplier-risk-api

    depends_on:
      - neo4j

    ports:
      - "8000:8000"

    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: supplier-risk-local


volumes:
  neo4j_data: